    <text x="141" y="283" text-anchor="middle" font-size="17" fill="#334155" font-weight="400">Go function</text><rect x="262" y="220" width="210" height="90" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="367" y="256" text-anchor="middle" font-size="22" fill="#334155" font-weight="600">Payments</text>
    <text x="367" y="283" text-anchor="middle" font-size="17" fill="#334155" font-weight="400">Go function</text><rect x="488" y="220" width="210" height="90" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
