    <text x="480" y="140" text-anchor="middle" font-size="17" fill="#174a8b" font-weight="400">Chooses what to check</text><path d="M480 167 V190 H141 V215" fill="none" stroke="#71839a" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 167 V190 H367 V215" fill="none" stroke="#71839a" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 167 V190 H593 V215" fill="none" stroke="#71839a" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 167 V190 H819 V215" fill="none" stroke="#71839a" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="220" width="210" height="90" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
